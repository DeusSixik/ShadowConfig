plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "shadowconfig.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowCommon
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    shadowCommon ("com.fasterxml.jackson.core:jackson-core:2.19.4")
    shadowCommon ("com.fasterxml.jackson.core:jackson-databind:2.19.4")
    shadowCommon ("com.fasterxml.jackson.core:jackson-annotations:2.19.4")
    shadowCommon ("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.4")
    shadowCommon ("com.fasterxml.jackson.dataformat:jackson-dataformat-toml:2.19.4")

    //implementation ("com.fasterxml.jackson.core:jackson-core:2.19.4")
    //implementation ("com.fasterxml.jackson.core:jackson-databind:2.19.4")
    //implementation ("com.fasterxml.jackson.core:jackson-annotations:2.19.4")
    //implementation ("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.4")
    //implementation ("com.fasterxml.jackson.dataformat:jackson-dataformat-toml:2.19.4")

    forgeRuntimeLibrary ("com.fasterxml.jackson.core:jackson-core:2.19.4")
    forgeRuntimeLibrary ("com.fasterxml.jackson.core:jackson-databind:2.19.4")
    forgeRuntimeLibrary ("com.fasterxml.jackson.core:jackson-annotations:2.19.4")
    forgeRuntimeLibrary ("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.4")
    forgeRuntimeLibrary ("com.fasterxml.jackson.dataformat:jackson-dataformat-toml:2.19.4")

    //include ("com.fasterxml.jackson.core:jackson-core:2.19.4")
    //include ("com.fasterxml.jackson.core:jackson-databind:2.19.4")
    //include ("com.fasterxml.jackson.core:jackson-annotations:2.19.4")
    //include ("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.4")
    //include ("com.fasterxml.jackson.dataformat:jackson-dataformat-toml:2.19.4")

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'

    from sourceSets.main.output
    from project(":common").sourceSets.main.output

    exclude "META-INF/maven/**"
    exclude "META-INF/scripts/**"

    relocate 'com.fasterxml.jackson', 'net.shadowking21.shadowconfig.shadowlib.jackson'
}

remapJar {
    input.set(shadowJar.archiveFile)
    dependsOn(shadowJar)
}
